<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zaturnava</title>
    <!-- relative, so the page works from whatever folder it is served in -->
    <base href="./" />
    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <!-- Until the page has loaded: how much of it has, as the runtime tells it while downloading (K). -->
    <div id="app">
        <div class="starting" role="status">
            <p class="starting-name">Zaturnava</p>
            <div class="starting-bar" aria-hidden="true"><span></span></div>
            <p class="starting-text">Loading the page: <span class="starting-percent"></span></p>
        </div>
    </div>
    <script src="js/zaturnava.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
